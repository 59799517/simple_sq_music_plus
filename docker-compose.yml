version: '3.8'

x-common-env: &common-env
  # 对外暴露服务端口
  PORT: "8099"
  # 下载文件地址
  MUSIC_PATH: /music
  # 数据库数据卷 数据库存储地址下方自行修改 mysql 的 volumes

  # --------一下配置可以不用管------------
  # 数据库IP
  DB_IP: "172.20.0.12"
  # 数据库端口(对外暴露)
  DB_PORT: "3316"
  # 本项目使用的数据库
  DB_NAME: sqmusic
  # 数据库登录账号
  DB_USERNAME: root
  # 数据库登录密码
  DB_PASSWORD: sqmusic123root456@@@
  # 对内QQapi IP地址
  QQ_IP: "172.20.0.10"
  # 对外 QQapi 端口
  QQ_PORT: "8007"
  # 对内酷狗api IP地址
  KG_IP: "172.20.0.11"
  # 对外酷狗api 端口
  KG_PORT: "3000"
  # --------------------请勿修改-----------------
  QQ_URL: http://${QQ_IP}:${QQ_PORT}
  KG_URL: http://${KG_IP}:${KG_PORT}

services:
  qqmusicapi1:
    build:
      context: https://gitclone.com/github.com/jsososo/QQMusicApi.git#master:.
    ports:
      - "${QQ_PORT}:80"
    networks:
      musicbridge:
        ipv4_address: ${QQ_IP}

  kugoumusicapi2:
    build:
      context: https://gitclone.com/github.com/MakcRe/KuGouMusicApi.git#main:.
    ports:
      - "${KG_PORT}:3000"
    environment:
      platform: lite
    networks:
      musicbridge:
        ipv4_address: ${KG_IP}

  mysql3:
    image: mysql:5.7
    environment:
      <<: *common-env
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - /volume1/nas_3t/code/test/var/lib/mysql:/var/lib/mysql  # 使用绑定挂载
    command: >
      bash -c 'if ! mysql -u root -p${DB_PASSWORD} -e "USE ${DB_NAME}"; then
        mysql -u root -p${DB_PASSWORD} -e "CREATE DATABASE ${DB_NAME};";
      fi && exec mysqld'
    networks:
      musicbridge:
        ipv4_address: ${DB_IP}

  sqmusicapi4:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:8099"
    environment:
      <<: *common-env
    networks:
      musicbridge:
        ipv4_address: 172.20.0.13

networks:
  musicbridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16


