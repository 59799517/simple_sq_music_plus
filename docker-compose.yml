version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: sqmusic-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sqmusic123root456@@@}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sqmusic123root456@@@}
    ports:
      - "${DB_PORT:-3316}:3306"  # 注意：移除多余的 } 符号
    volumes:
      - mysql_data:/var/lib/mysql
    command: >      
      bash -c "
      set -e
      docker-entrypoint.sh mysqld &

      until mysqladmin -u root -p$${MYSQL_ROOT_PASSWORD} ping --silent; do
        echo 'Waiting for MySQL to start...'
        sleep 2
      done

      mysql -u root -p$${MYSQL_ROOT_PASSWORD} -e 'CREATE DATABASE IF NOT EXISTS sqmusic;'

      wait
      "
    networks:
      - musicnet
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqmusic-app
    ports:
      - "${PORT:-8099}:8099"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sqmusic
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-sqmusic123root456@@@}
      MUSIC_PATH: ${MUSIC_PATH:-/music}
    depends_on:
      - mysql
    networks:
      - musicnet
    restart: unless-stopped

  kugou:
    image: kugou:latest
    container_name: sqmusic-kugou
    build:
      context: https://github.com/MakcRe/KuGouMusicApi.git#main
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - musicnet
    restart: unless-stopped

networks:
  musicnet:
    driver: bridge

volumes:
  mysql_data:

