version: '3.8'

services:
  # 主应用服务（后端 + 前端 + H2数据库）- ARM64 架构
  sqmusic_main:
    build:
      context: .
      dockerfile: Dockerfile.arm
    image: registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest
    container_name: sqmusic_main_arm
    environment:
      # JVM 参数（ARM 优化）
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+UseContainerSupport
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=kw,mg,qq,netease,kg
    volumes:
      # 音乐下载目录
      - ./music:/music
      # H2数据库和数据文件持久化
      - ./data:/app/data
    ports:
      - "8099:8099"
    restart: unless-stopped
