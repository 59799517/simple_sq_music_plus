server:
  port: 8099
spring:
  datasource:
    url: jdbc:h2:file:D:/code/simple_sq_musuc_plus/src/main/resources/db/sqmusic;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;SCHEMA=PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password:
    type: com.zaxxer.hikari.HikariDataSource
    # 连接池
    hikari:
      #连接池名
      pool-name: DateHikariCP
      #最小空闲连接数
      minimum-idle: 5
      # 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 180000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 10
      # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  h2:
    console:
      enabled: false              # 启用 H2 Console
      path: /h2-console          # 访问路径
      settings:
        web-allow-others: false   # 允许远程访问
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null
  profiles:
    active: kw,mg,qq,netease,kg
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,classpath:/docs/
  main:
    allow-circular-references: true
    banner-mode: off
  task:
    execution:
      pool:
        size: 20
        core-size: 20
        max-size: 40
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.sqmusicplus.v3.*.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/*Mapper.xml
  # 加载全局的配置文件
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
  global-config:
    db-config:
      select-strategy: NOT_NULL
      schema: ""
    banner: false


# 日志配置
logging:
  level:
    com.sqmusicplus: debug
    org.springframework: warn
    org.jaudiotagger: warn
sa-token:
  # token 名称 (同时也是cookie名称)
  token-name: sqmusic
  # token 有效期，单位s 默认30天, -1代表永不过期
  timeout: -1
  # token 临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  is-print: false
  jwt-secret-key: xNQRcYuu7FgccHM1dyJCoZKmSSqqcmksmmNT7aR0FlqvRCWiiJbmD

version: 3.1.1
webversion: 3.1.0


