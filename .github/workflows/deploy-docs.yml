name: 部署 Docsify 文档

on:
  push:
    branches: [ 3.0 ]
    paths:
      - src/main/resources/docs/**
  workflow_dispatch:  

permissions:
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/main/resources/docs 

      - name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
