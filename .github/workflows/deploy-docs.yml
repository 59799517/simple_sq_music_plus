name: Deploy Docsify
on:
  push:
    branches: [ 3.0 ]
    paths:
      - src/main/resources/docs/**

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/main/resources/docs

      - name: Deploy
        uses: actions/deploy-pages@v4
