name: Build Netease Cloud Music API

# 仅手动触发，可自定义版本号
on:
  workflow_dispatch:
    inputs:
      npm_version:
        description: '要构建的 npm 包版本号（如 4.32.0），留空则自动使用 npm 最新版本'
        required: false
        default: ''
      update_compose:
        description: '构建成功后是否同步更新 compose 文件版本号 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write  # 允许提交更新后的 compose 版本号

env:
  IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/sqdockler/netease_cloud_music_api
  NPM_PACKAGE: NeteaseCloudMusicApi
  DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
  DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"

jobs:
  build-and-push:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # 确定要构建的版本：优先使用手动输入的版本号，否则读取 npm 最新版本
      - name: Resolve version to build
        id: npm_version
        run: |
          if [ -n "${{ inputs.npm_version }}" ]; then
            VERSION="${{ inputs.npm_version }}"
            echo "使用手动指定的版本: $VERSION"
          else
            VERSION=$(curl -sL "https://registry.npmjs.org/${NPM_PACKAGE}/latest" | jq -r '.version')
            echo "使用 npm 最新版本: $VERSION"
          fi
          # 校验版本号格式，防止非法输入
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "错误: 版本号格式非法: $VERSION (应为 x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 若该版本镜像已存在则跳过，避免重复构建
      - name: Check if image already exists
        id: check_image
        run: |
          if docker manifest inspect "${IMAGE_NAME}:v${{ steps.npm_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "镜像 v${{ steps.npm_version.outputs.version }} 已存在，跳过构建"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push to Aliyun
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./netease-cloud-music-api
          file: ./netease-cloud-music-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v${{ steps.npm_version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 新版本构建成功后，可把 compose 文件里的固定版本号更新到本次构建版本并提交，
      # 保证 compose 引用的是构建好的固定版本（可用 update_compose 输入控制）
      - name: Update compose version and commit
        if: steps.check_image.outputs.exists == 'false' && inputs.update_compose == 'true'
        run: |
          NEW_TAG="v${{ steps.npm_version.outputs.version }}"
          echo "更新 compose 版本号到: ${NEW_TAG}"

          for file in docker-compose.yml docker-compose-arm.yml docker-compose-template.yml docker-compose-arm-template.yml; do
            if [ -f "$file" ]; then
              sed -i "s|${IMAGE_NAME}:v[0-9.]*|${IMAGE_NAME}:${NEW_TAG}|g" "$file"
              echo "已更新: $file"
            fi
          done

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docker-compose.yml docker-compose-arm.yml docker-compose-template.yml docker-compose-arm-template.yml
          if git diff --cached --quiet; then
            echo "无版本号变更，跳过提交"
          else
            git commit -m "chore: update netease api image version to ${NEW_TAG}"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 网易云音乐 API 镜像状态" >> $GITHUB_STEP_SUMMARY
          echo "- 本次构建版本: **v${{ steps.npm_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.npm_version }}" ]; then
            echo "- 版本来源: 手动指定" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 版本来源: npm 最新版" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.check_image.outputs.exists }}" == "true" ]; then
            echo "- 结果: 该版本已存在，无需重新构建" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 结果: 已构建并推送镜像" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 镜像地址: \`${IMAGE_NAME}:v${{ steps.npm_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
