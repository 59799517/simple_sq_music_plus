name: Java CI with Maven and Multi-Arch Release

on:
  push:
    branches: [ 3.0-small ] # 只在提交到 3.0-small 分支时触发

permissions:
  packages: write  # 允许推送 Docker 镜像

env:
  APP_VERSION: ""
  WEB_VERSION: ""
  DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
  DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ci_enabled: ${{ steps.app_version.outputs.ci_enabled }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.16.2/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Read Application Version and CI Flag
        id: app_version
        run: |
          VERSION=$(cd src/main/resources && yq e '.version' application.yml)
          WEBVERSION=$(cd src/main/resources && yq e '.webversion' application.yml 2>/dev/null || echo "")
          CI_ENABLED=$(cd src/main/resources && yq e '.ci_enabled' application.yml 2>/dev/null || echo "true")
          
          # 添加 small 后缀到版本号
          DOCKER_VERSION="${VERSION}-small"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "webversion=$WEBVERSION" >> $GITHUB_OUTPUT
          echo "ci_enabled=$CI_ENABLED" >> $GITHUB_OUTPUT
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "WEB_VERSION=$WEBVERSION" >> $GITHUB_ENV
          echo "CI_ENABLED=$CI_ENABLED" >> $GITHUB_ENV
          echo "DOCKER_VERSION=$DOCKER_VERSION" >> $GITHUB_ENV
          
          echo "APP_VERSION: $VERSION"
          echo "WEB_VERSION: $WEBVERSION"
          echo "CI_ENABLED: $CI_ENABLED"
          echo "DOCKER_VERSION: $DOCKER_VERSION"
          
          echo "$VERSION" > version.txt
          echo "$WEBVERSION" > webversion.txt
          echo "$CI_ENABLED" > ci_enabled.txt
          echo "$DOCKER_VERSION" > docker_version.txt

      - name: Check CI Enabled Flag
        if: env.CI_ENABLED != 'true'
        run: |
          echo "⚠️ CI/CD is disabled by ci_enabled flag in application.yml"
          echo "Set ci_enabled: true to enable builds"
          echo "Skipping remaining steps..."
          exit 0


      - name: Generate new manifest file
        run: |
          # 进入 fnOS 目录
          cd fnOS

          # 从模板生成新的 manifest 文件
          sed "s/{VERSION}/$APP_VERSION/g; s/{WEB_VERSION}/$WEB_VERSION/g" manifest.template > manifest
          # 显示生成后的内容以供验证
          echo "=== Generated manifest ==="
          cat manifest

      - name: Push changes to fnOS manifest
        continue-on-error: true  # 即使失败也继续执行后续步骤
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: List Environment Variables
        run: env

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            version.txt
            webversion.txt

  build-amd64:
    name: Build and Push AMD64 Image
    needs: build
    if: needs.build.outputs.ci_enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cat version.txt 2>/dev/null || echo "unknown")
          DOCKER_VERSION="${VERSION}-small"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOCKER_VERSION=$DOCKER_VERSION" >> $GITHUB_ENV

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AMD64 Image to Aliyun
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest-amd64
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.DOCKER_VERSION }}
            org.opencontainers.image.architecture=linux/amd64
          provenance: false
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push AMD64 Image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest-amd64
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.DOCKER_VERSION }}
            org.opencontainers.image.architecture=linux/amd64
          provenance: false
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    name: Build and Push ARM64 Image
    needs: build
    if: needs.build.outputs.ci_enabled == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cat version.txt 2>/dev/null || echo "unknown")
          DOCKER_VERSION="${VERSION}-small"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOCKER_VERSION=$DOCKER_VERSION" >> $GITHUB_ENV

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ARM64 Image to Aliyun
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest-arm64
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.DOCKER_VERSION }}
            org.opencontainers.image.architecture=linux/arm64
          provenance: false
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push ARM64 Image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest-arm64
          build-args: |
            JAR_FILE=target/simple_sq_music_plus.jar
          labels: |
            org.opencontainers.image.title=Simple Music Server
            org.opencontainers.image.description=Music streaming server with multi-arch support
            org.opencontainers.image.version=v${{ env.DOCKER_VERSION }}
            org.opencontainers.image.architecture=linux/arm64
          provenance: false
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest-list:
    name: Create Manifest Lists
    needs: [build-amd64, build-arm64]
    if: needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info

      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cat version.txt 2>/dev/null || echo "unknown")
          DOCKER_VERSION="${VERSION}-small"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOCKER_VERSION=$DOCKER_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Manifest List for Aliyun
        run: |
          # 强制删除可能存在的旧manifest（忽略错误）
          echo "Cleaning up existing manifests..."
          docker manifest rm registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} 2>/dev/null || true
          docker manifest rm registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest 2>/dev/null || true

          # 等待更长时间确保镜像完全同步
          echo "Waiting for image synchronization..."
          sleep 30

          # 验证基础镜像是否存在（可选，失败不中断）
          echo "Checking if base images exist..."
          docker pull registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 || echo "Warning: amd64 image not found, will retry in manifest create"
          docker pull registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 || echo "Warning: arm64 image not found, will retry in manifest create"

          # 检查拉取的镜像是不是manifest list
          echo "Verifying image types..."
          AMD64_TYPE=$(docker manifest inspect registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 | jq -r '.mediaType' 2>/dev/null || echo "unknown")
          ARM64_TYPE=$(docker manifest inspect registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 | jq -r '.mediaType' 2>/dev/null || echo "unknown")

          echo "AMD64 image type: $AMD64_TYPE"
          echo "ARM64 image type: $ARM64_TYPE"

          # 创建多架构manifest（使用--amend确保覆盖）
          echo "Creating manifest for version v${{ env.DOCKER_VERSION }} with overwrite mode"
          docker manifest create registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 --amend

          # 注解各架构信息
          docker manifest annotate registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 \
            --arch amd64 --os linux

          docker manifest annotate registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 \
            --arch arm64 --os linux

          # 强制推送manifest（覆盖模式）
          echo "Force pushing manifest for version v${{ env.DOCKER_VERSION }}"
          docker manifest push registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} --purge

          # 为small-latest标签创建manifest（使用--amend确保覆盖）
          echo "Creating manifest for small-latest tag with overwrite mode"
          docker manifest create registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest-amd64 \
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest-arm64 --amend

          echo "Force pushing manifest for small-latest tag"
          docker manifest push registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:small-latest --purge

      - name: Create and Push Manifest List for GitHub Packages
        run: |
          # 强制删除可能存在的旧manifest（忽略错误）
          echo "Cleaning up existing manifests..."
          docker manifest rm ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} 2>/dev/null || true
          docker manifest rm ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest 2>/dev/null || true

          # 等待更长时间确保镜像完全同步
          echo "Waiting for image synchronization..."
          sleep 30

          # 验证基础镜像是否存在（可选，失败不中断）
          echo "Checking if base images exist..."
          docker pull ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 || echo "Warning: amd64 image not found, will retry in manifest create"
          docker pull ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 || echo "Warning: arm64 image not found, will retry in manifest create"

          # 检查拉取的镜像是不是manifest list
          echo "Verifying image types..."
          AMD64_TYPE=$(docker manifest inspect ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 | jq -r '.mediaType' 2>/dev/null || echo "unknown")
          ARM64_TYPE=$(docker manifest inspect ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 | jq -r '.mediaType' 2>/dev/null || echo "unknown")

          echo "AMD64 image type: $AMD64_TYPE"
          echo "ARM64 image type: $ARM64_TYPE"

          # 创建多架构manifest（使用--amend确保覆盖）
          echo "Creating manifest for version v${{ env.DOCKER_VERSION }} with overwrite mode"
          docker manifest create ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 --amend

          # 注解各架构信息
          docker manifest annotate ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-amd64 \
            --arch amd64 --os linux

          docker manifest annotate ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }}-arm64 \
            --arch arm64 --os linux

          # 强制推送manifest（覆盖模式）
          echo "Force pushing manifest for version v${{ env.DOCKER_VERSION }}"
          docker manifest push ghcr.io/${{ github.actor }}/simple_sq_music_plus:v${{ env.DOCKER_VERSION }} --purge

          # 为small-latest标签创建manifest（使用--amend确保覆盖）
          echo "Creating manifest for small-latest tag with overwrite mode"
          docker manifest create ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest-amd64 \
            ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest-arm64 --amend

          echo "Force pushing manifest for small-latest tag"
          docker manifest push ghcr.io/${{ github.actor }}/simple_sq_music_plus:small-latest --purge