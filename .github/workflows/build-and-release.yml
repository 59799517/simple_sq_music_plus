name: Java CI with Maven and Release

on:
  push:
    branches: [ 3.0 ] # 只在提交到3.0分支时触发

env:
  APP_VERSION: ""
  WEB_VERSION: ""
  DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
  DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml' # optional
      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.16.2/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - name: Read Application Version
        id: app_version
        run: |
          VERSION=$(cd src/main/resources && yq e '.version' application.yml)
          WEBVERSION=$(cd src/main/resources && yq e '.webversion' application.yml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "webversion=$WEBVERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "WEB_VERSION=$WEBVERSION" >> $GITHUB_ENV
          echo "APP_VERSION: $VERSION"
          echo "WEB_VERSION: $WEBVERSION"
          echo "$VERSION" > version.txt
          echo "$WEBVERSION" > webversion.txt
      - name: Replace version in docker-compose files
        run: |
          # 替换 docker-compose.yml 中的版本号
          sed -i "s/v\[version\]/v$APP_VERSION/g" docker-compose.yml
          sed -i "s/v\[webversion\]/v$WEB_VERSION/g" docker-compose.yml
          
          # 替换 docker-compose-local.yml 中的版本号
          sed -i "s/v\[version\]/v$APP_VERSION/g" docker-compose-local.yml
          sed -i "s/v\[webversion\]/v$WEB_VERSION/g" docker-compose-local.yml
          
          # 显示替换后的文件内容以供验证
          echo "=== docker-compose.yml ==="
          cat docker-compose.yml
          echo -e "\n=== docker-compose-local.yml ==="
          cat docker-compose-local.yml
      - name: Commit updated docker-compose files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docker-compose.yml docker-compose-local.yml
          git commit -m "Update docker-compose files with version $APP_VERSION and web version $WEB_VERSION" || echo "No changes to commit"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      - name: List Environment Variables
        run: env
      - name: Build with Maven
        run: |
          mvn -B package --file pom.xml
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: |
            target/*.jar 
            version.txt
            webversion.txt
            docker-compose.yml
            docker-compose-local.yml
      - name: Build the Docker image
        run: |
          docker version
          # 登录阿里云镜像仓库
          docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD registry.cn-hangzhou.aliyuncs.com
          # 使用Dockerfile构建镜像
          docker build . --file Dockerfile.main --tag registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v$APP_VERSION
          # 推送镜像到镜像仓库
          docker push registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:v$APP_VERSION
      -  name: Push to GitHub Packages
         run: |
           docker version
            # 登录 GitHub Packages
           docker login ghcr.io --username=${{ github.actor }} --password=${{ secrets.GITHUB_TOKEN }}
           
           # 构建 Docker 镜像
           docker build . --file Dockerfile.main --tag ghcr.io/${{ github.actor }}/simple_sq_music_plus:v$APP_VERSION
           
           # 推送镜像到 GitHub Packages
           docker push ghcr.io/${{ github.actor }}/simple_sq_music_plus:v$APP_VERSION

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/3.0' }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact
      - name: Display structure of downloaded files
        run: ls -R
      - name: Read Version from Artifact
        id: app_version
        run: |
          VERSION=$(cat version.txt)
          WEBVERSION=$(cat webversion.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "webversion=$WEBVERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION: $VERSION"
          echo "WEB_VERSION: $WEBVERSION"
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          release_name: Release ${{ steps.app_version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/simple_sq_music_plus.jar
          asset_name: simple_sq_music_plus${{ steps.app_version.outputs.version }}.jar
          asset_content_type: application/octet-stream