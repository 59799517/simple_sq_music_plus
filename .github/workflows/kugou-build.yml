name: Build KuGouMusicApi
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "KuGouMusicApi 的 Git Tag，例如 15.1 或 v15.1"
        required: true
        default: "15.1"
        type: string
jobs:
  build:
    name: Build and Push KuGouMusicApi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KuGouMusicApi Tag
        uses: actions/checkout@v4
        with:
          repository: MakcRe/KuGouMusicApi
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sqdockler/kugoumusicapi:${{ inputs.tag }}
            registry.cn-hangzhou.aliyuncs.com/sqdockler/kugoumusicapi:latest
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
          provenance: false
